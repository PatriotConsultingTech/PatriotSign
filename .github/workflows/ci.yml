name: PatriotSign CI

on:
  pull_request:
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: patriotsign-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/OpenSignServer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/OpenSignServer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  client:
    name: Client lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/OpenSign
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/OpenSign/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The npm build script also fetches the upstream version and rewrites public/version.txt.
      - run: ./node_modules/.bin/vite build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
